spring.datasource.url=jdbc:mysql://localhost:3306/urban_apparel?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=change-me-in-production-must-be-at-least-256-bits-long-secret-key
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
